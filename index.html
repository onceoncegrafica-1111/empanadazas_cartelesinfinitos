<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Simulador Cartel de Vacío Infinito - EMPANADAZAS</title>
  <style>
    :root {
      --gold-crust: #e2942b;
      --gold-bake: #a85813;
      --cheese-hot: #fff4ba;
      --cheese-deep: #ebaa36;
      --led-cyan: #22d3ee;
      --led-amber: #f59e0b;
      --frame-color: #15161a;
      --frame-border: #262933;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 50%, #161822 0%, #050608 100%);
      color: #fff;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      perspective: 1400px;
    }

    /* BARRA SUPERIOR */
    header.toolbar-wrap {
      width: 100%;
      padding: 10px 14px;
      display: flex;
      justify-content: center;
      z-index: 1000;
      background: rgba(10, 11, 15, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      max-width: 1200px;
    }

    .tool-group {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      padding: 3px 6px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      gap: 3px;
    }

    .tool-label {
      font-size: 10px;
      font-weight: 800;
      color: #8b92a5;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 0 6px 0 4px;
    }

    button {
      background: transparent;
      border: 1px solid transparent;
      color: #c9cdd8;
      padding: 5px 11px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
      white-space: nowrap;
    }

    button:hover {
      background: rgba(245, 158, 11, 0.15);
      color: #fff;
    }

    button.active {
      background: var(--led-amber);
      border-color: var(--led-amber);
      color: #0d0e12;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.6);
    }

    /* ESCENARIO PRINCIPAL */
    main.stage {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
      touch-action: none;
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body.is-floor main.stage {
      transform: rotateX(60deg) scale(0.92);
    }

    body.is-floor .chassis {
      border-color: #c9933b !important;
      box-shadow: 0 35px 80px rgba(0, 0, 0, 0.98), 0 0 40px rgba(201, 147, 59, 0.3);
    }

    /* CHASIS FÍSICO CON ESCALA ADAPTATIVA DE CONTENIDO */
    .chassis {
      position: relative;
      background: #020204;
      border-radius: 16px;
      border: 14px solid var(--frame-color);
      outline: 2px solid var(--frame-border);
      box-shadow: inset 0 0 25px #000, 0 18px 45px rgba(0, 0, 0, 0.85);
      overflow: hidden;
      transform-style: preserve-3d;
      transition: width 0.3s ease, height 0.3s ease, border-radius 0.3s ease;
      will-change: transform;
    }

    /* FORMATOS CON VARIABLES DE TAMAÑO Y ESCALA DE GRÁFICA */
    .size-150x70  { 
      width: min(780px, 88vw); 
      height: min(364px, 46vh); 
      --format-scale: 0.95; 
    }
    
    .size-200x100 { 
      width: min(860px, 92vw); 
      height: min(430px, 50vh); 
      --format-scale: 1.15; 
    }
    
    .size-50x30   { 
      width: min(550px, 82vw); 
      height: min(330px, 42vh); 
      --format-scale: 0.72; 
    }

    /* Formato Redondo: ampliado y con proporción equilibrada */
    .size-50x50   { 
      width: min(520px, 86vw, 54vh); 
      height: min(520px, 86vw, 54vh); 
      border-radius: 50% !important; 
      --format-scale: 0.65; 
    }

    /* COMPORTAMIENTO REDONDO */
    body.is-round .chassis,
    body.is-round .tunnel-layer,
    body.is-round .led-strip {
      border-radius: 50% !important;
    }

    /* ESPEJO ESPÍA DELANTERO */
    .mirror-front {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.11) 0%, rgba(255,255,255,0.01) 40%, rgba(0,0,0,0.65) 100%);
      pointer-events: none;
      z-index: 80;
    }

    body.power-off .mirror-front {
      opacity: 0.98;
      background: linear-gradient(135deg, rgba(255,255,255,0.35) 0%, rgba(130,130,130,0.2) 50%, rgba(8,9,12,0.98) 100%);
    }

    body.power-off .tunnel,
    body.power-off .round-perimeter-text {
      display: none !important;
    }

    /* TÚNEL DE REBOTES */
    .tunnel {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
    }

    .tunnel-layer {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      will-change: transform;
    }

    /* TIRA DE LEDS PERIMETRAL */
    .led-strip {
      position: absolute;
      inset: 6px;
      border-radius: 10px;
      border: 3px dotted rgba(245, 158, 11, 0.75);
      box-shadow: inset 0 0 10px rgba(245, 158, 11, 0.25);
    }

    body.cyan-dots .led-strip {
      border-color: var(--led-cyan);
      box-shadow: inset 0 0 10px rgba(34, 211, 238, 0.4);
    }

    @keyframes chaseAnim {
      0% { border-color: rgba(245, 158, 11, 0.95); }
      50% { border-color: rgba(255, 235, 160, 0.25); }
      100% { border-color: rgba(245, 158, 11, 0.95); }
    }

    body.chase-on .led-strip {
      animation: chaseAnim 1.6s infinite linear;
    }

    /* GRÁFICA ADAPTATIVA AL FORMATO */
    .sign-assembly {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transform: scale(calc(var(--format-scale, 1) * min(1, 100vw / 820)));
      transform-origin: center center;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .acrylic-title {
      display: flex;
      justify-content: center;
      gap: 3px;
    }

    .acrylic-char {
      display: inline-block;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #fffef2;
      text-shadow: 
        0 1px 0px #b87a14,
        0 2px 0px #704706,
        0 3px 5px rgba(0, 0, 0, 0.95),
        0 0 8px rgba(245, 158, 11, 0.4);
    }

    .subtitle .acrylic-char {
      font-size: 23px;
    }

    /* EMPANADA VECTORIAL */
    .empanada-stage {
      position: relative;
      width: 240px;
      height: 95px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 1px 0;
    }

    .empanada-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .brand-svg {
      width: 205px;
      height: auto;
      margin-top: 2px;
    }

    /* FRASE CIRCULAR CONTINUA 360° PARA FORMATO REDONDO */
    .round-perimeter-text {
      display: none;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 70;
      pointer-events: none;
    }

    body.is-round .round-perimeter-text {
      display: block;
    }

    .ring-text {
      font-size: 9.2px;
      font-weight: 800;
      fill: #fffef2;
      opacity: 0.95;
      text-shadow: 0 0 6px rgba(245, 158, 11, 0.85), 0 0 12px rgba(245, 158, 11, 0.4);
      transition: text-shadow 0.25s ease;
    }

    body.cyan-dots .ring-text {
      text-shadow: 0 0 6px rgba(34, 211, 238, 0.85), 0 0 12px rgba(34, 211, 238, 0.4);
    }

    /* FOOTER */
    footer.app-footer {
      padding: 6px 12px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.45);
      text-align: center;
      background: rgba(8, 9, 12, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      z-index: 100;
    }
  </style>
</head>
<body class="mode-wall chase-on">

  <header class="toolbar-wrap">

      <div class="tool-group">

        <button class="active" onclick="setSize('150x70', this, false)">150×70 cm</button>
        <button onclick="setSize('50x50', this, true)">50×50 cm (Redondo)</button>
        <button onclick="setSize('200x100', this, false)">200×100 cm</button>
        <button onclick="setSize('50x30', this, false)">50×30 cm</button>
      </div>

      <!-- MONTAJE -->
      <div class="tool-group">
        <span class="tool-label">Montaje:</span>

        <button id="btn-view-floor" onclick="setView('floor')">Piso 3D</button>
      </div>

        <button class="active" id="btn-chase" onclick="toggleChase()">Giro</button>
        <button id="btn-power" onclick="togglePower()">Power</button>
      </div>

    </div>
  </header>

          </textPath>
        </text>
      </svg>

      <!-- Túnel infinito -->
      <div class="tunnel" id="tunnel"></div>
    </div>
  </main>

  <footer class="app-footer">
    Mueve el mouse o inclina el teléfono para probar la profundidad 3D • Acrílico Grabado y Marco de Polímero
  </footer>

    // INICIALIZAR 8 CAPAS LIGERAS
    const tunnel = document.getElementById('tunnel');
    const TOTAL_LAYERS = 8;
    const layers = [];

    function initLayers() {
      tunnel.innerHTML = '';
      layers.length = 0;

      for (let i = 0; i < TOTAL_LAYERS; i++) {
        const layer = document.createElement('div');
        layer.className = 'tunnel-layer';

        const led = document.createElement('div');
        led.className = 'led-strip';
        layer.appendChild(led);

        const art = document.createElement('div');
        art.innerHTML = graphicTemplate;
        layer.appendChild(art);

        const scale = Math.pow(0.83, i);
        const opacity = Math.max(0.12, Math.pow(0.76, i));

        layer.style.opacity = opacity;
        layer.dataset.depth = i + 1;
        layer.dataset.baseScale = scale;

        tunnel.appendChild(layer);
        layers.push(layer);
      }
    }

    initLayers();

    // RENDER LOOP A 60-120 FPS
    const box = document.getElementById('boxFrame');
    let targetX = 0, targetY = 0;
    let currX = 0, currY = 0;
    let isUserActive = false;
    let idleTimer = null;

    function render() {
      if (!isUserActive) {
        const t = performance.now() * 0.0015;
        targetX = Math.sin(t) * 0.35;
        targetY = Math.cos(t * 0.8) * 0.25;
      }

      currX += (targetX - currX) * 0.16;
      currY += (targetY - currY) * 0.16;

      box.style.transform = `rotateY(${currX * 10}deg) rotateX(${-currY * 10}deg)`;

      for (let i = 0; i < layers.length; i++) {
        const layer = layers[i];
        const depth = parseFloat(layer.dataset.depth);
        const scale = parseFloat(layer.dataset.baseScale);
        
        const ox = currX * (depth * 1.8);
        const oy = currY * (depth * 1.8);

        layer.style.transform = `translate3d(${ox}px, ${oy}px, 0) scale(${scale})`;
      }

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);

    // EVENTOS INTERACTIVOS (MOUSE + TOUCH + GIROSCOPIO)
    function touchActive() {
      isUserActive = true;
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => { isUserActive = false; }, 3000);
    }

    window.addEventListener('mousemove', (e) => {
      touchActive();
      targetX = (e.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
      targetY = (e.clientY - window.innerHeight / 2) / (window.innerHeight / 2);
    });

    const stage = document.getElementById('stageEl');
    stage.addEventListener('touchmove', (e) => {
      touchActive();
      if (e.touches.length > 0) {
        const t = e.touches[0];
        targetX = (t.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
        targetY = (t.clientY - window.innerHeight / 2) / (window.innerHeight / 2);
      }
    }, { passive: true });

    if (window.DeviceOrientationEvent) {
      window.addEventListener('deviceorientation', (e) => {
        if (e.gamma !== null && e.beta !== null) {
          touchActive();
          targetX = Math.max(-1, Math.min(1, e.gamma / 25));
          targetY = Math.max(-1, Math.min(1, (e.beta - 40) / 25));
        }
      }, { passive: true });
    }

    // CONTROLES DE BARRA
    function setSize(sizeClass, btn, isRound) {
      btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      box.className = `chassis size-${sizeClass}`;
      document.body.classList.toggle('is-round', isRound);
    }

    function setView(view) {
      document.body.classList.toggle('is-floor', view === 'floor');
      document.getElementById('btn-view-wall').classList.toggle('active', view === 'wall');
      document.getElementById('btn-view-floor').classList.toggle('active', view === 'floor');
    }

    function setLedColor(color) {
      document.body.classList.toggle('cyan-dots', color === 'cyan');
      document.getElementById('btn-led-amber').classList.toggle('active', color === 'amber');
      document.getElementById('btn-led-cyan').classList.toggle('active', color === 'cyan');
    }

    function toggleChase() {
      const active = document.body.classList.toggle('chase-on');
      document.getElementById('btn-chase').classList.toggle('active', active);
    }

    let isPowerOn = true;
    function togglePower() {
      isPowerOn = !isPowerOn;
      document.body.classList.toggle('power-off', !isPowerOn);
      document.getElementById('btn-power').textContent = isPowerOn ? 'Power' : 'Encender';
      document.getElementById('btn-power').classList.toggle('active', !isPowerOn);
    }
  </script>
